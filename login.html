<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barangay System Login</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#eaf1ed;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login{background:white;padding:35px;border-radius:12px;width:100%;max-width:400px;box-shadow:0 5px 20px #0002}
h2{text-align:center;color:#123b2a}
p{text-align:center;color:#777}
input{width:100%;padding:14px;margin:10px 0 18px;border:1px solid #ccc;border-radius:6px}
button{width:100%;padding:14px;background:#17643e;color:white;border:0;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div class="login">
<h2>BARANGAY MANAGEMENT SYSTEM</h2>
<p>Administrator Login</p>
<form id="loginForm">
<label>Username</label>
<input id="username" required>
<label>Password</label>
<input id="password" type="password" required>
<button type="submit">Login</button>
</form>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit",function(e){
e.preventDefault();
alert("Login is not yet connected to the secure authentication database. Please wait for backend integration.");
});
</script>
</body>
</html>
